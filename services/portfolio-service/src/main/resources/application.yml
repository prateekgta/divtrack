server:
  port: 8082

spring:
  application:
    name: portfolio-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/divtrack?currentSchema=portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:divtrack}
    password: ${SPRING_DATASOURCE_PASSWORD:localdev123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: portfolio
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    default-schema: portfolio
    schemas: portfolio
    create-schemas: true
    locations: classpath:db/migration

market:
  service:
    url: ${MARKET_SERVICE_URL:http://localhost:8083}

jwt:
  public-key: ${JWT_PUBLIC_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
