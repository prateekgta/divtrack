server:
  port: 8083

spring:
  application:
    name: market-data-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/divtrack?currentSchema=market}
    username: ${SPRING_DATASOURCE_USERNAME:divtrack}
    password: ${SPRING_DATASOURCE_PASSWORD:localdev123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: market
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    default-schema: market
    schemas: market
    create-schemas: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

scraper:
  interval-seconds: ${SCRAPE_INTERVAL_SECONDS:60}

resilience4j:
  circuitbreaker:
    instances:
      yahooFinance:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s

management:
  endpoints:
    web:
      exposure:
        include: health, info
