server:
  port: 8080

spring:
  application:
    name: divtrack

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://localhost:5432/divtrack?currentSchema=public
    username: divtrack
    password: ${DB_PASSWORD:localdev123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=90s

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    expiry-minutes: 15
    refresh-expiry-days: 7

  market:
    scrape-interval-seconds: 300
    provider: yahoo

  subscription:
    free-tier:
      max-holdings: 10
      max-alerts: 3
      snowball-simulator: false
      tax-optimizer: false
    pro-tier:
      price: 5

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/dashboard}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/pricing}

logging:
  level:
    io.divtrack: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/divtrack?currentSchema=public

  jpa:
    show-sql: true

logging:
  level:
    io.divtrack: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:divtrack;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  cache:
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10s
