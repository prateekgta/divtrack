version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: divtrack
      POSTGRES_USER: divtrack
      POSTGRES_PASSWORD: localdev123
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divtrack -d divtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/divtrack?currentSchema=public
      SPRING_DATASOURCE_USERNAME: divtrack
      SPRING_DATASOURCE_PASSWORD: localdev123
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3001:3001"]
    environment:
      PORT: 3001
    depends_on: [backend]
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  gateway:
    build: ./gateway
    ports: ["3000:3000"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://backend:8080
      PORTFOLIO_SERVICE_URL: http://backend:8080
      MARKET_SERVICE_URL: http://backend:8080
      JWT_PUBLIC_KEY_LOCATION: ${JWT_PUBLIC_KEY_LOCATION}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
  redis-data:
