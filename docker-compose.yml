version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: divtrack
      POSTGRES_USER: divtrack
      POSTGRES_PASSWORD: localdev123
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divtrack -d divtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/divtrack?currentSchema=public
      SPRING_DATASOURCE_USERNAME: divtrack
      SPRING_DATASOURCE_PASSWORD: localdev123
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3001:3001"]
    environment:
      PORT: 3001
    depends_on: [backend]
    restart: on-failure

volumes:
  pgdata:
