# Render Blueprint — one-click deploy for DivTrack
# https://render.com/docs/blueprint-spec
#
# Step 1: Create a PostgreSQL database manually on Render
# Step 2: Deploy this blueprint, then paste DB connection details into env vars
# Step 3: Set JWT_PRIVATE_KEY and JWT_PUBLIC_KEY (run ./generate-keys.sh)

services:
  - type: web
    name: divtrack-backend
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://<host>:<port>/divtrack?currentSchema=public
      - key: SPRING_DATASOURCE_USERNAME
        value: divtrack
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: "6379"
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport"

  - type: web
    name: divtrack-gateway
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: AUTH_SERVICE_URL
        sync: false
      - key: PORTFOLIO_SERVICE_URL
        sync: false
      - key: MARKET_SERVICE_URL
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport"
